name: Aethero
description: Aethero designs and manufactures radiation-hardened, space-rated edge
  computing systems and AI/ML software for satellites, space stations, and orbital
  data centers, enabling autonomous on-orbit processing of imagery and sensor data
  rather than downlinking raw feeds. Its NVIDIA Jetson Orin/Thor-based NxN-ECM and
  NxA-ECM edge computing modules, Titan and Phobos platforms, the Aether fleet-management
  software framework, and the AMATDT model annotation/training/deployment tool let
  spacecraft run AI inference in orbit. Founded in 2023 and headquartered in San
  Francisco, Aethero raised an $8.4M seed round led by Kindred Ventures in June 2025.
  Aethero exposes no public web API today; this profile captures the company's
  identity and its live domain-security posture for the API Evangelist network.
