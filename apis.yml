- aid: aetherospace:amatdt
  name: AMATDT API
  description: 'The backend API of AMATDT, Aethero''s first-party model annotation, training and deployment tool, served at amatdt.aethero.com/api by a NestJS application. Probed 2026-09-12: https://amatdt.aethero.com/api/ returns HTTP 401 {"message":"Unauthorized","statusCode":401}, and every Swagger/OpenAPI path a NestJS app would expose (/api/docs, /api/docs-json, /api/swagger-json, /api/openapi.json) returns a JSON 404 from the application itself, so no specification is published. Customer-only: there is no anonymous reference.'
  image: https://www.aethero.com/wp-content/uploads/2026/03/Aethero_Logo_Square_Black.jpg
