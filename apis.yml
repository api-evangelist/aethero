apis:
- aid: aetherospace:aether-rdfm
  name: Aether Fleet Management (RDFM)
  description: 'The authenticated fleet-management and over-the-air update API behind Aethero''s "Aether" user portal at cloud.aethero.com. The service is a self-hosted deployment of RDFM (Remote Device Fleet Manager), the Apache-2.0 open-source framework Antmicro implemented on Aethero''s user portal under the two companies'' July 2024 partnership — so the endpoint and the deployment are Aethero''s, while the API CONTRACT is Antmicro''s upstream RDFM project and is not authored or published by Aethero. Probed 2026-09-12: /api/v1/devices, /api/v1/groups and /api/v1/packages all return HTTP 401 {"error":"no Authorization header was provided"} — a real, live, token-gated API with no anonymous reference and no machine-readable contract published on any Aethero host.'
  image: https://www.aethero.com/wp-content/uploads/2026/03/Aethero_Logo_Square_Black.jpg
  humanURL: https://cloud.aethero.com/
  baseURL: https://cloud.aethero.com/api/v1
  x-operator: vendor-contract-self-hosted
